# Nixpacks configuration for Railway deployment
# Installs FFmpeg for MP3 audio processing with pydub

[phases.setup]
nixPkgs = ["ffmpeg", "libsndfile"]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "python -c \"from transformers import Wav2Vec2Model, Wav2Vec2Processor; Wav2Vec2Processor.from_pretrained('facebook/wav2vec2-base-960h'); Wav2Vec2Model.from_pretrained('facebook/wav2vec2-base-960h')\""
]

[start]
cmd = "uvicorn app:app --host 0.0.0.0 --port ${PORT:-8000} --timeout-keep-alive 120"
